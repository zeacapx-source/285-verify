<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>285 VFY</title>
    <link rel="icon" type="image/png" href="logo_285.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070709;
            --card-bg: rgba(15, 15, 20, 0.88);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            --accent-green: #22c55e;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            color: var(--text-primary);
            padding: 20px;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(40, 44, 56, 0.22) 0%, rgba(10, 10, 14, 0.6) 55%, transparent 75%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        .verify-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 32px 30px;
            text-align: center;
            box-shadow: var(--card-shadow);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .server-logo-wrap {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 16px;
        }

        .server-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            background-color: #0b0c0e;
        }

        .server-verify-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .verify-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .verify-subtitle {
            font-size: 18px;
            font-weight: 500;
            color: #e5e7eb;
            margin-top: 4px;
            margin-bottom: 24px;
        }

        .user-box {
            background: rgba(22, 24, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            text-align: left;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            background-color: #1a1c23;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .username {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-green);
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .desc-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 18px;
            background: rgba(22, 101, 52, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
            border-radius: 12px;
            color: #4ade80;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #181a1f 0%, #0d0f13 100%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            margin-bottom: 26px;
        }

        .btn-discord:hover {
            background: linear-gradient(135deg, #242832 0%, #13161c 100%);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .btn-discord svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(30, 32, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            color: #ffffff;
            background: rgba(45, 48, 60, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .social-btn svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .footer {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer .brand {
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

            <div class="user-details">
                <span class="username" id="userName">285.member</span>

        <div class="footer">
            <p>© 2026 Discord Server 285</p>
            <p>Powered by <span class="brand">285 System</span></p>
        </div>
    </main>

    <script>
        // ดึงชื่อและอวาตาร์จากพารามิเตอร์ URL (ถ้ามีส่งมา)
        const params = new URLSearchParams(window.location.search);
        const name = params.get('user') || params.get('username');
        const avatar = params.get('avatar');
        if (name) {
            document.getElementById('userName').innerText = decodeURIComponent(name);
        }
        if (avatar) {
            document.getElementById('userAvatar').src = decodeURIComponent(avatar);
        }
    </script>
</body>
</html>
